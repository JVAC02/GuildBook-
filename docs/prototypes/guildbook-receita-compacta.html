<script>
(() => {
  const ns = globalThis.GuildBookCore ||= {};
  const rounded = value => Math.round((value + Number.EPSILON) * 100) / 100;
  function calculate({ units, unit, unitsPerMl, intervalHours, days, packSize }) {
    if (![units, intervalHours, days].every(value => Number.isFinite(value) && value > 0) || 24 % intervalHours !== 0) return null;
    const liquid = unit === 'gotas' && Number.isFinite(unitsPerMl) && unitsPerMl > 0;
    const required = rounded((units / (liquid ? unitsPerMl : 1)) * (24 / intervalHours) * days);
    const packs = Number.isFinite(packSize) && packSize > 0 ? Math.ceil(required / packSize) : null;
    return { required, closedPack: packs === null ? null : rounded(packs * packSize), packs, unit: liquid ? 'mL' : unit };
  }
  const fmt = value => new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 }).format(value);
  const singular = unit => ({ comprimidos: 'comprimido', cápsulas: 'cápsula', gotas: 'gota' })[unit] || unit;
  const plural = (unit, count) => count === 1 ? unit : ({ comprimido: 'comprimidos', cápsula: 'cápsulas', gota: 'gotas', frasco: 'frascos', caixa: 'caixas', bisnaga: 'bisnagas' })[unit] || unit;
  const measure = (amount, unit) => `${fmt(amount)} ${({comprimido:'CP',comprimidos:'CP','cápsula':'CAP','cápsulas':'CAP',ampola:'AMP','frasco-ampola':'FA',frasco:'FR',caixa:'CX',bisnaga:'TB',mL:'mL',g:'g',gota:'GOTAS',gotas:'GOTAS'})[unit] || unit}`;
  function packageText(packages, container, sizeUnit) {
    return container ? measure(packages.reduce((sum, item) => sum + item.count, 0), container) : measure(rounded(packages.reduce((sum, item) => sum + item.size * item.count, 0)), sizeUnit);
  }
  function suggestPack(required, sizes) {
    if (!Number.isFinite(required) || required <= 0 || !sizes.length) return null;
    const decimals = value => (String(value).split('.')[1] || '').length;
    const scale = 10 ** Math.min(2, Math.max(decimals(required), ...sizes.map(decimals)));
    const target = Math.ceil(required * scale - 1e-8);
    const steps = sizes.map(size => Math.round(size * scale));
    const limit = Math.ceil(target / steps[0]) * steps[0];
    const best = new Array(limit + 1);
    best[0] = new Array(sizes.length).fill(0);
    for (let sum = 0; sum <= limit; sum++) {
      if (!best[sum]) continue;
      for (let index = 0; index < steps.length; index++) {
        const next = sum + steps[index];
        if (next > limit) continue;
        const candidate = best[sum].slice();
        candidate[index]++;
        if (!best[next] || candidate.reduce((a, b) => a + b, 0) < best[next].reduce((a, b) => a + b, 0)) best[next] = candidate;
      }
    }
    const total = best.findIndex((combination, sum) => sum >= target && combination);
    return total < 0 ? null : best[total].flatMap((count, index) => count ? [{ size: sizes[index], count }] : []);
  }
  function plan({ presentation, regimen, dose, days }) {
    const policy = presentation.quantityPolicy || (regimen.quantityKind === 'facility' ? 'none' : regimen.quantityKind === 'variable' ? 'manual' : 'calculate');
    const sizeUnit = presentation.packageSizeUnit || (['mL', 'g'].includes(presentation.packageUnit) ? presentation.packageUnit : dose?.unit === 'gotas' ? 'mL' : dose?.unit);
    const container = presentation.packageSizeUnit ? presentation.packageUnit || null : null;
    const sizes = [...new Set((presentation.packageSizes || []).filter(size => Number.isFinite(size) && size > 0))].sort((a, b) => a - b);
    const validDays = Number.isInteger(Number(days)) && Number(days) > 0 && Number(days) <= (regimen.durationKind === 'max7' ? 7 : 365);
    const unitsPerMl = dose?.unit === 'gotas' && Number.isFinite(dose?.volumeMl) && dose.volumeMl > 0 ? dose.units / dose.volumeMl : undefined;
    const calculated = policy === 'calculate' && dose && validDays ? calculate({ units: dose.units, unit: dose.unit, unitsPerMl, intervalHours: regimen.intervalHours, days: Number(days) }) : null;
    const required = calculated?.required ?? null;
    const suggestion = suggestPack(required, sizes);
    return { policy, required, isMaximum: regimen.quantityKind === 'maximum', unit: singular(calculated?.unit || sizeUnit) || null, container, sizes, options: sizes.map(size => ({ size, label: packageText([{ size, count: 1 }], container, sizeUnit) })), suggestion, canFractionate: presentation.canFractionate === true };
  }
  function select(plan, { kind, size, amount } = {}) {
    if (plan.policy === 'none' || !plan.unit) return null;
    if (kind === 'suggested' && plan.required != null) {
      if (!plan.suggestion) return { quantity: plan.required, unit: plan.unit, text: measure(plan.required, plan.unit), method: 'automatic', packages: [] };
      const quantity = rounded(plan.suggestion.reduce((sum, item) => sum + item.size * item.count, 0));
      return { quantity, unit: plan.unit, text: packageText(plan.suggestion, plan.container, plan.unit), method: 'automatic', packages: plan.suggestion };
    }
    if (kind === 'package' && plan.sizes.includes(size) && (plan.required == null || size >= plan.required)) return { quantity: size, unit: plan.unit, text: packageText([{ size, count: 1 }], plan.container, plan.unit), method: 'confirmed-package', packages: [{ size, count: 1 }] };
    if (kind === 'manual' && Number.isFinite(amount) && amount > 0 && (plan.canFractionate || !['comprimido', 'cápsula'].includes(plan.unit) || Number.isInteger(amount))) return { quantity: amount, unit: plan.unit, text: measure(amount, plan.unit), method: 'manual', packages: [] };
    return null;
  }
  ns.quantity = { calculate, suggestPack, plan, select, measure, packageText };
})();

(() => {
  const ns = globalThis.GuildBookCore ||= {};
  const number = value => new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 }).format(value);
  const abbreviation = unit => ({ comprimido: 'CP', cápsula: 'CAP', ampola: 'AMP', 'frasco-ampola': 'FR', mL: 'mL', g: 'G', gotas: 'GOTAS' })[unit] || unit.toUpperCase();
  const routeName = route => ({ oral: 'USO ORAL', tópica: 'USO TÓPICO', intramuscular: 'USO INTRAMUSCULAR', intravenosa: 'USO INTRAVENOSO', inalatória: 'USO INALATÓRIO', nasal: 'USO NASAL', oftálmica: 'USO OFTÁLMICO', otológica: 'USO OTOLÓGICO', vaginal: 'USO VAGINAL' })[route] || `USO ${route.toUpperCase()}`;
  const doseAmount = value => number(value);
  function instruction(item) {
    const asNeeded = item.intervalText.endsWith(', se necessário');
    let interval = asNeeded ? item.intervalText.slice(0, -', se necessário'.length) : item.intervalText;
    interval = interval.replace(/^a cada (\d+) horas?/, (_, hours) => `de ${hours}/${hours}h`).replace(/^uma vez ao dia/, '1 vez ao dia');
    const use = item.route === 'tópica'
      ? `Aplicar na área afetada ${interval}`
      : `${item.verb} ${doseAmount(item.dose.units)} ${abbreviation(item.dose.unit)} ${interval}`;
    const symptomaticDipyrone = asNeeded && item.medicineId === 'dipirona';
    return `${use}${item.durationDays && !symptomaticDipyrone ? ` por ${item.durationDays} ${item.durationDays === 1 ? 'dia' : 'dias'}` : ''}${asNeeded ? symptomaticDipyrone ? ' se dor ou febre' : ' se necessário' : ''}.`.toUpperCase();
  }
  function createItem({ medicine, presentation, regimen, dose, days, dispensing }) {
    if (!medicine || !presentation || !regimen || !dose || presentation.context !== 'ambulatory' || !dispensing || !(dispensing.quantity > 0)) return null;
    const durationDays = Number.isInteger(Number(days)) && Number(days) > 0 && Number(days) <= (regimen.durationKind === 'max7' ? 7 : 365) ? Number(days) : null;
    const item = {
      key: `${medicine.id}/${presentation.id}/${regimen.id}`, medicineId: medicine.id, medicineName: medicine.name,
      presentationId: presentation.id, regimenId: regimen.id, population: regimen.population,
      label: presentation.label, concentration: presentation.concentration, form: presentation.form,
      route: presentation.route, dose: { units: dose.units, unit: dose.unit, mg: dose.mg, volumeMl: dose.volumeMl ?? null },
      intervalText: regimen.intervalText, intervalHours: regimen.intervalHours ?? null,
      durationKind: regimen.durationKind, quantityKind: regimen.quantityKind, verb: regimen.verb || 'Tomar',
      durationDays, quantity: dispensing.quantity, quantityUnit: dispensing.unit, quantityText: dispensing.text,
      quantityMethod: dispensing.method, packageSizes: presentation.packageSizes || [], packageUnit: presentation.packageUnit || null,
      packageSizeUnit: presentation.packageSizeUnit || null, quantityPolicy: presentation.quantityPolicy || null,
      canFractionate: presentation.canFractionate === true
    };
    item.instruction = instruction(item);
    return item;
  }
  function updateItem(item, { days, quantity }) {
    const durationDays = Number.isInteger(Number(days)) && Number(days) > 0 && Number(days) <= (item.durationKind === 'max7' ? 7 : 365) ? Number(days) : null;
    const presentation = { packageSizes: item.packageSizes || [], packageUnit: item.packageUnit, packageSizeUnit: item.packageSizeUnit, quantityPolicy: item.quantityPolicy, canFractionate: item.canFractionate };
    const regimen = { quantityKind: item.quantityKind, intervalHours: item.intervalHours, durationKind: item.durationKind };
    const plan = ns.quantity.plan({ presentation, regimen, dose: item.dose, days: durationDays });
    const dispensing = quantity !== '' ? ns.quantity.select(plan, { kind: 'manual', amount: Number(quantity) }) : durationDays ? ns.quantity.select(plan, { kind: 'suggested' }) : item.quantityMethod === 'confirmed-package' ? { quantity: item.quantity, unit: item.quantityUnit, text: item.quantityText, method: item.quantityMethod } : null;
    if (!dispensing) return null;
    const updated = { ...item, durationDays, quantity: dispensing.quantity, quantityUnit: dispensing.unit, quantityText: dispensing.text, quantityMethod: dispensing.method };
    updated.instruction = instruction(updated);
    return updated;
  }
  function upsert(items, item) {
    const index = items.findIndex(existing => existing.key === item.key);
    if (index < 0) return [...items, item];
    return items.map((existing, position) => position === index ? item : existing);
  }
  function remove(items, key) { return items.filter(item => item.key !== key); }
  function prescriptionName(item) {
    return item.label.split(' — ')[0];
  }
  function formatSections(items, patient = '', details = {}) {
    const title = 'RECEITUÁRIO SIMPLES\n\n';
    const intro = `PACIENTE: ${patient.trim() || '________________________________'}\n\nPRESCRIÇÃO:\n\n`;
    const parts = [];
    const routes = [...new Set(items.map(item => item.route))];
    for (const route of routes) {
      parts.push(routeName(route), '');
      items.filter(item => item.route === route).forEach((item, index) => {
        const amount = item.quantityText ? item.quantityText.toUpperCase() : item.quantity == null ? 'QUANTIDADE PENDENTE' : ns.quantity.measure(item.quantity, item.quantityUnit).toUpperCase();
        const name = `${index + 1}. ${prescriptionName(item).toUpperCase()}`;
        const dashes = '-'.repeat(Math.max(4, 40 - name.length - 2));
        parts.push(`${name} ${dashes} ${amount}`, `   ${item.instruction}`, '');
      });
    }
    const body = `${parts.join('\n')}\n`;
    const provided = value => String(value || '').trim();
    const line = fields => fields.filter(([, value]) => provided(value)).map(([label, value]) => `${label}: ${provided(value)}`).join('    ');
    const optional = [
      line([['NOME DO(A) MÉDICO(A)', details.doctorName]]),
      line([['CRM', details.crm], ['UF', details.doctorUf]]),
      line([['LOCAL DE ATENDIMENTO', details.serviceName], ['CNES', details.cnes]]),
      line([['ENDEREÇO', details.address], ['BAIRRO', details.neighborhood]]),
      line([['CIDADE', details.city], ['UF', details.serviceUf], ['TELEFONE', details.phone]])
    ].filter(Boolean);
    const iso = provided(details.issuedAt);
    const date = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '__/__/____';
    const needsIdentification = !provided(details.doctorName) || !provided(details.crm) || !provided(details.doctorUf);
    const footer = `DATA DE EMISSÃO: ${date}\n\n${optional.length ? `${optional.join('\n')}\n\n` : ''}________________________________________\nASSINATURA DO(A) MÉDICO(A)${needsIdentification ? '\nNOME E CRM/UF: __________________________' : ''}`;
    return { title, intro, body, footer };
  }
  function format(items, patient = '', details = {}) { return Object.values(formatSections(items, patient, details)).join(''); }
  ns.prescription = { createItem, updateItem, upsert, remove, format, formatSections, instruction, abbreviation, routeName };
})();

(() => {
  const ns = globalThis.GuildBookCore ||= {};
  const rounded = value => Math.round((value + Number.EPSILON) * 100) / 100;
  function eligible(presentation, regimen, { weightKg, ageMonths } = {}) {
    if (regimen.population !== 'pediatric') return null;
    const pediatric = presentation?.pediatric || {};
    const dose = regimen.dose;
    if (pediatric.pediatricAllowed === false || (pediatric.doseKind && pediatric.doseKind !== dose.kind)) return false;
    for (const bounds of [pediatric, dose]) {
      if (Number.isFinite(ageMonths) && (bounds.minAgeMonths != null && ageMonths < bounds.minAgeMonths || bounds.maxAgeMonths != null && ageMonths >= bounds.maxAgeMonths)) return false;
      if (Number.isFinite(weightKg) && (bounds.minWeightKg != null && weightKg < bounds.minWeightKg || bounds.maxWeightKg != null && weightKg > bounds.maxWeightKg)) return false;
    }
    if (dose.kind === 'weightBands' && Number.isFinite(weightKg) && !dose.bands.some(row => weightKg >= row.minKg && weightKg <= row.maxKg)) return false;
    return true;
  }
  function resolve(regimen, { weightKg, ageMonths, chosenUnits } = {}, presentation) {
    if (!eligible(presentation, regimen, { weightKg, ageMonths })) return null;
    const dose = regimen.dose;
    const pediatric = presentation?.pediatric || {};
    if ([pediatric, dose].some(bounds => (bounds.minAgeMonths != null || bounds.maxAgeMonths != null) && !Number.isFinite(ageMonths))) return null;
    if ([pediatric, dose].some(bounds => (bounds.minWeightKg != null || bounds.maxWeightKg != null) && !Number.isFinite(weightKg))) return null;
    const unitsForMg = (mg, strengthMg) => {
      if (!Number.isFinite(mg) || mg <= 0 || !Number.isFinite(strengthMg) || strengthMg <= 0) return null;
      const rawUnits = mg / strengthMg;
      const units = rounded(rawUnits);
      if (Math.abs(rawUnits - units) > 1e-6 || units <= 0) return null;
      const fraction = rounded(units % 1);
      if (dose.unit === 'comprimido' || dose.unit === 'cápsula') {
        if (fraction && (pediatric.mustSwallowWhole || pediatric.canSplit !== true || !pediatric.allowedFractions?.includes(fraction))) return null;
      } else if (dose.unit === 'gotas' && fraction) return null;
      return { units, mg: rounded(mg), unit: dose.unit };
    };
    if (dose.kind === 'fixed') {
      if (Number.isFinite(dose.units) && Number.isFinite(dose.mg)) {
        const fraction = rounded(dose.units % 1);
        if (fraction && (dose.unit === 'comprimido' || dose.unit === 'cápsula') && (pediatric.mustSwallowWhole || pediatric.canSplit !== true || !pediatric.allowedFractions?.includes(fraction))) return null;
        return dose;
      }
      return unitsForMg(dose.fixedDose ?? pediatric.fixedDose, dose.strengthMg ?? pediatric.strengthMg);
    }
    if (dose.kind === 'perKg') {
      const perKg = dose.dosePerKg ?? pediatric.dosePerKg;
      if (!Number.isFinite(weightKg) || weightKg <= 0 || !Number.isFinite(perKg) || perKg <= 0) return null;
      const mg = Math.min(weightKg * perKg, dose.maxDose ?? pediatric.maxDose ?? Infinity);
      return unitsForMg(mg, dose.strengthMg ?? pediatric.strengthMg);
    }
    if (!Number.isFinite(ageMonths) && (dose.kind === 'ageWeightDrops' || dose.minAgeMonths != null || dose.maxAgeMonths != null)) return null;
    if (dose.kind === 'weightBands') {
      if (!Number.isFinite(weightKg) || weightKg <= 0) return null;
      const band = dose.bands.find(row => weightKg >= row.minKg && weightKg <= row.maxKg);
      if (!band) return null;

(() => {
  const ns = globalThis.GuildBookCore ||= {};
  function presentation(medicine, id) { return medicine.presentations.find(item => item.id === id) || null; }
  function populations(item) { return [...new Set(item.regimens.map(row => row.population))]; }
  function presentationsForPopulation(medicine, population, { ageMonths, weightKg } = {}) {
    return medicine.presentations.filter(item => item.regimens.some(row => {
      if (row.population !== population) return false;
      if (population !== 'pediatric') return true;
      return ns.pediatric.eligible(item, row, { ageMonths, weightKg });
    }));
  }
  function regimen(item, population, id) { return item.regimens.find(row => row.population === population && (!id || row.id === id)) || null; }
  function normalize(value) { return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
  function search(items, query) {
    const term = normalize(query);
    if (!term) return items;
    return items.map(item => {
      const name = normalize(item.name);
      const aliases = (item.aliases || []).map(normalize);
      const rank = name === term ? 0 : name.startsWith(term) ? 1 : aliases.some(a => a === term) ? 2 : aliases.some(a => a.includes(term)) ? 3 : name.includes(term) ? 4 : 99;
      return { item, rank };
    }).filter(row => row.rank < 99).sort((a, b) => a.rank - b.rank).map(row => row.item);
  }

})();

 if(!dose){hint('Informe idade e peso compatíveis com a apresentação para visualizar a dose cadastrada.');return;}
 if(p.context!=='ambulatory'){
  out.innerHTML='<pre class="gb-preview">'+esc(r.verb+' '+fmt(dose.units)+' '+core.prescription.abbreviation(dose.unit)+' · '+r.routeText+'.\n'+r.intervalText+'.'+(p.preparation?'\n\n'+p.preparation:''))+'</pre><p class="gb-hint">'+esc(r.maxDoseText)+'</p><p class="gb-hint">Duração e quantidade dependem da avaliação assistencial. Montagem ambulatorial não se aplica.</p>';return;
 }
 const manual=root.querySelector('#gb-manual-wrap');if(manual)manual.hidden=d.quantity!=='manual';
 const validDays=d.days===''||Number.isInteger(Number(d.days))&&Number(d.days)>0&&Number(d.days)<=(r.durationKind==='max7'?7:365);
 if(!validDays){out.innerHTML='<p class="gb-hint gb-error" role="alert">Informe uma duração inteira entre 1 e '+(r.durationKind==='max7'?7:365)+' dias.</p>';return;}
 const plan=core.quantity.plan({presentation:p,regimen:r,dose,days:d.days});
 let dispensing=null;
 if(d.quantity==='auto')dispensing=core.quantity.select(plan,{kind:'suggested'});
 else if(d.quantity.startsWith('pack:'))dispensing=core.quantity.select(plan,{kind:'package',size:Number(d.quantity.slice(5))});
 else if(d.quantity==='manual')dispensing=core.quantity.select(plan,{kind:'manual',amount:Number(d.manual)});
 const instruction=core.prescription.instruction({medicineId:m.id,route:p.route,verb:r.verb,dose,intervalText:r.intervalText,durationDays:d.days===''?null:Number(d.days)});
 let item=dispensing?core.prescription.createItem({medicine:m,presentation:p,regimen:r,dose,days:d.days,dispensing}):null;
 const display=item?core.prescription.formatSections([item]).body.trim():core.prescription.routeName(p.route)+'\n\n1. '+p.label.split(' — ')[0].toUpperCase()+' -------- QUANTIDADE PENDENTE\n   '+instruction;
 out.innerHTML='<pre class="gb-preview">'+esc(display)+'</pre><p class="gb-hint">'+esc(r.maxDoseText)+'</p>'+(d.quantity==='auto'&&!d.days?'<p class="gb-hint">Informe a duração para calcular a quantidade.</p>':d.quantity.startsWith('pack:')&&!dispensing?'<p class="gb-hint gb-error" role="alert">A embalagem escolhida não cobre a quantidade calculada. Selecione o cálculo pela duração ou informe a quantidade.</p>':d.quantity==='manual'&&!dispensing?'<p class="gb-hint">Informe uma quantidade válida.</p>':'')+(plan.isMaximum&&plan.required!=null?'<p class="gb-hint">Quantidade calculada para o uso máximo do esquema; não indica uso obrigatório.</p>':'');
}
root.addEventListener('click',e=>{
 const med=e.target.closest('[data-med]');if(med){state.open=state.open===med.dataset.med?null:med.dataset.med;renderList();return;}
 const presentation=e.target.closest('[data-presentation]');if(presentation){state.selections[state.open+'/'+state.pop]=presentation.dataset.presentation;renderList();return;}
 const pop=e.target.closest('[data-pop]');if(pop){state.pop=pop.dataset.pop;root.querySelectorAll('[data-pop]').forEach(b=>b.setAttribute('aria-pressed',String(b===pop)));root.querySelector('#gb-patient').hidden=state.pop!=='pediatric';renderList();}
});
root.addEventListener('input',e=>{
 if(e.target.id==='gb-search'){state.query=e.target.value;renderList();return;}
 if(e.target.id==='gb-age'||e.target.id==='gb-weight'){state[e.target.id==='gb-age'?'age':'weight']=e.target.value;renderList();return;}
 const field=e.target.dataset.field;if(field){const m=medicines.find(x=>x.id===state.open),p=chosen(m);if(p){draft(p)[field]=e.target.value;updateOutput();}}
});
renderList();
})();
</script>
